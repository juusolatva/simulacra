name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '40 15 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Results are not uploaded to GitHub code scanning (upload-sarif: false) because the
# repository is private and code scanning needs GitHub Code Security there. The scan
# still fails the check on a vulnerability and prints its findings in the job log.
# Set upload-sarif back to true (the PR job's original expression is in the git
# history) once the repository is public. The called workflows still declare
# security-events: write, so the permission blocks below must keep granting it.
#
# This repository's only lockfile is core/Cargo.lock (the Python module has no
# dependencies), and -r finds it and any lockfile added later.
jobs:
  scan-scheduled:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      scan-args: |-
        -r
        ./

  scan-pr:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      scan-args: |-
        -r
        ./

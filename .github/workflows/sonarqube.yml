name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Test with coverage and analyze
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks, so the scan only runs
    # for pushes and for pull requests from this repository (including Dependabot's).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read # Check out the code
      pull-requests: read # Let the scanner find the pull request it decorates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for blame and new-code detection
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run the tests without the Rust core
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install coverage maturin
          .venv/bin/python -m coverage run -m unittest -v

      # Building the core makes the native tests run too, which adds the Python lines
      # that hand scenes to Rust. Both runs go into one report.
      - name: Build the Rust core and run the tests again
        run: |
          .venv/bin/maturin develop -m core/py/Cargo.toml
          .venv/bin/python -m coverage run --append -m unittest -v
          .venv/bin/python -m coverage xml

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

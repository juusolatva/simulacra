name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Test with coverage and analyze
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks, so the scan only runs
    # for pushes and for pull requests from this repository (including Dependabot's).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read # Check out the code
      pull-requests: read # Let the scanner find the pull request it decorates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for blame and new-code detection
          persist-credentials: false

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable && rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      # One step, because core/coverage.sh sources `cargo llvm-cov show-env` into its
      # own shell. It runs the workspace tests (the CLI integration tests run an
      # instrumented binary) and the engine's portable fixtures, writes lcov.info,
      # and fails if check_lcov.sh finds no hits in the binary's main() or in the
      # shaders, so coverage that stopped contributing fails the step.
      - name: Test with Rust coverage
        run: core/coverage.sh

      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: Tests

# Runs for every pull request, including those from forks: it needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}${{ matrix.core && ' with the Rust core' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
        core: [false, true]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build the Rust core
        if: ${{ matrix.core }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin
          .venv/bin/maturin develop --release -m core/Cargo.toml

      - name: Run the tests
        run: |
          if [ -x .venv/bin/python ]; then python=.venv/bin/python; else python=python; fi
          "$python" -m unittest -v

  native-larger:
    name: Native matches Python at larger sizes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the Rust core and compare it with Python
        env:
          ABSTRACT_ART_SLOW: '1'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin
          .venv/bin/maturin develop --release -m core/Cargo.toml
          .venv/bin/python -m unittest -v -k larger_sizes test_abstract_art

  rust:
    name: Cargo test and Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PyO3 links against Python, so the crate's tests need an interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Cargo test
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings

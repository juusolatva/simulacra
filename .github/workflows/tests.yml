name: Tests

# Runs for every pull request, including those from forks: it needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Cargo test and Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      # The workspace root is a virtual manifest, so these cover both crates.
      - name: Cargo test
        run: cargo test --locked --manifest-path core/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test and Clippy with the portable math backend
        run: |
          cargo test --locked --manifest-path core/Cargo.toml --features portable
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets --features portable -- -D warnings

      # The engine on its own, without the CLI's dependencies and features.
      - name: Engine alone
        run: |
          cargo test --locked --manifest-path core/Cargo.toml -p simulacra_engine
          cargo clippy --locked --manifest-path core/Cargo.toml -p simulacra_engine --all-targets -- -D warnings
          cargo clippy --locked --manifest-path core/Cargo.toml -p simulacra_engine --all-targets --features portable -- -D warnings

      # Scenes from JSON: core/engine/tests/fixtures/ holds one committed scene per style
      # with the SHA-256 of its portable render, which must match on every platform.
      # With the platform libm the fixtures only have to load and render.
      - name: Portable fixtures
        run: |
          cargo test --locked --manifest-path core/Cargo.toml -p simulacra_engine --features json,portable
          cargo test --locked --manifest-path core/Cargo.toml -p simulacra_engine --features json
          cargo clippy --locked --manifest-path core/Cargo.toml -p simulacra_engine --all-targets --features json,portable -- -D warnings

  golden:
    name: Golden hashes (portable binary)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable

      - name: Self-test the checker
        run: sh core/cli/tests/golden_selftest.sh

      # Every golden workload's file must hash as committed in
      # core/cli/tests/golden/SHA256SUMS, and every decoded frame as in PIXELS
      # (and the fixture workloads as the portable fixtures). The hashes hold
      # for portable builds, as release binaries are.
      - name: Golden file and pixel hashes
        run: |
          cargo build --locked --release --manifest-path core/Cargo.toml -p simulacra_cli --features portable
          out="$RUNNER_TEMP/golden"
          sh core/cli/tests/golden.sh check core/target/release/simulacra --keep "$out"
          SIMULACRA_GOLDEN_OUT="$out" cargo test --locked --release --manifest-path core/Cargo.toml -p simulacra_cli --features portable --test golden_pixels -- --ignored

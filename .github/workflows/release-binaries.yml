name: Release binaries

# Builds and checks the `simulacra` binary for every release target: Linux
# (x86_64, aarch64) and Windows (x86_64); macOS is not a target (there is
# no Mac to test a download on). On branches and pull requests the packages
# are workflow artifacts kept 14 days. Pushing a tag `vX.Y.Z` also drafts a
# GitHub release from the same packages (see "Releasing" in AGENTS.md);
# nothing is published until someone publishes the draft.
#
# build:   on a native runner per target, run the portable fixtures and the
#          CLI tests, build with `cargo install --locked`
#          (as the README tells users to install it) and package the binary.
# verify:  on a fresh runner, download the package as a user would, unpack it and
#          run core/cli/tests/golden.sh: every golden workload (every style at
#          several sizes, seeds, phases and palettes, APNG and GIF animations)
#          must hash as committed in core/cli/tests/golden/SHA256SUMS. Every
#          target is held to the same hashes, so they all render identically.
#          On Linux the binary runs in a clean container image with no Rust
#          toolchain; the runner needs none either (the checker is POSIX sh).
# tag:     (tags only) the tag must be `v` + the crate version in
#          core/Cargo.toml, on a commit that is on main.
# release: (tags only) after every target verified: names the packages after
#          the version, writes SHA256SUMS, attests their build provenance
#          (`gh attestation verify FILE --repo OWNER/simulacra`) and creates a
#          draft release with generated notes and the packages attached.
on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes, so every v* tag runs.
    tags: ['v*']
    paths:
      - 'core/**'
      - '.github/workflows/release-binaries.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/release-binaries.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # debian:trixie-slim (multi-arch index): a clean system, no Rust toolchain.
  CLEAN_IMAGE: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Check out the code
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable

      # Every target builds natively, so the tests below run on the target itself.
      - name: Check that the runner is the target
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "runner host $host is not $TARGET" >&2
            exit 1
          fi

      - name: Portable fixtures
        run: cargo test --locked --manifest-path core/Cargo.toml -p simulacra_engine --features json

      - name: CLI tests
        run: cargo test --locked --manifest-path core/Cargo.toml -p simulacra_cli

      # Built the way the README tells users to install it (cargo install with
      # --locked), so the binary the jobs below check is the one
      # users get. cargo install uses the workspace's release profile.
      - name: Build the release binary with cargo install
        run: cargo install --locked --path core/cli --target "$TARGET" --root install

      # tar keeps the executable bit, which artifact zips would drop.
      - name: Package
        run: |
          mkdir package
          cp LICENSE README.md package/
          if [ "$RUNNER_OS" = Windows ]; then
            cp install/bin/simulacra.exe package/
            (cd package && 7z a "../simulacra-$TARGET.zip" .)
          else
            cp install/bin/simulacra package/
            tar -czf "simulacra-$TARGET.tar.gz" -C package .
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulacra-${{ matrix.target }}
          path: simulacra-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Check out the checker and the golden hashes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, container: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, container: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: simulacra-${{ matrix.target }}
          path: download

      - name: Unpack
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -odist "download/simulacra-$TARGET.zip"
          else
            tar -xzf "download/simulacra-$TARGET.tar.gz" -C dist
          fi
          ls -l dist

      - name: Show the dynamic libraries the binary needs
        if: runner.os == 'Linux'
        run: ldd dist/simulacra

      - name: Check the binary against the golden hashes
        run: |
          binary=dist/simulacra
          if [ "$RUNNER_OS" = Windows ]; then binary=dist/simulacra.exe; fi
          sh core/cli/tests/golden.sh check "$binary" \
            ${CONTAINER:+--container "$CLEAN_IMAGE"}

  tag:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Check out the code and its history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release names the version the binary prints (`simulacra --version`)
      # and comes from reviewed code on main.
      - name: The tag is the crate version, on main
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' core/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME is not v$version, the version in core/Cargo.toml" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi

  release:
    name: Draft the release
    needs: [tag, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the draft release and upload its assets
      id-token: write # Sign the provenance attestations (Sigstore certificate)
      attestations: write # Store the attestations
      artifact-metadata: write # Requested by actions/attest for storage records
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simulacra-*
          merge-multiple: true
          path: download

      - name: Name the packages after the version
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir release
          for package in download/simulacra-*; do
            name=$(basename "$package")
            mv "$package" "release/simulacra-$version-${name#simulacra-}"
          done
          ls -l release
          count=$(find release -type f | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "expected 3 packages, found $count" >&2
            exit 1
          fi

      # The verified x86_64 Linux package must print the tagged version.
      - name: The binary reports the version
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir check
          tar -xzf "release/simulacra-$version-x86_64-unknown-linux-gnu.tar.gz" -C check
          reported=$(check/simulacra --version)
          if [ "$reported" != "simulacra $version" ]; then
            echo "the binary reports '$reported', not 'simulacra $version'" >&2
            exit 1
          fi

      - name: Checksums
        run: |
          cd release
          sha256sum simulacra-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/simulacra-*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "simulacra $GITHUB_REF_NAME" --generate-notes

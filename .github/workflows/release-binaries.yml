name: Release binaries

# Test builds of the standalone `simulacra` binary for every release target:
# Linux (x86_64, aarch64) and Windows (x86_64); macOS is not a target
# (PLAN.md Phase 3). Nothing is published: the first release waits for the
# finished Rust rewrite, so the packages are workflow artifacts kept 14 days.
#
# build:   on a native runner per target, run the portable fixtures and the
#          CLI tests, build with `cargo install --locked --features portable`
#          (as the README tells users to install it) and package the binary.
# verify:  on a fresh runner, download the package as a user would, unpack it and
#          run core/cli/tests/golden.sh: every golden workload (every style at
#          several sizes, seeds, phases and palettes, APNG and GIF animations)
#          must hash as committed in core/cli/tests/golden/SHA256SUMS. Every
#          target is held to the same hashes, so they all render identically.
#          On Linux the binary runs in a container image with no Python and no
#          Rust; the runner needs neither (the checker is POSIX sh).
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/release-binaries.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/release-binaries.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # debian:trixie-slim (multi-arch index): no Python, no Rust toolchain.
  NO_PYTHON_IMAGE: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Check out the code
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the stable toolchain
        run: rustup update stable && rustup default stable

      # Every target builds natively, so the tests below run on the target itself.
      - name: Check that the runner is the target
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$TARGET" ]; then
            echo "runner host $host is not $TARGET" >&2
            exit 1
          fi

      - name: Portable fixtures
        run: cargo test --locked --manifest-path core/Cargo.toml -p simulacra_engine --features json,portable

      - name: CLI tests
        run: cargo test --locked --manifest-path core/Cargo.toml -p simulacra_cli --features portable

      # Built the way the README tells users to install it (cargo install with
      # --locked and portable), so the binary the jobs below check is the one
      # users get. cargo install uses the workspace's release profile.
      - name: Build the release binary with cargo install
        run: cargo install --locked --path core/cli --features portable --target "$TARGET" --root install

      # tar keeps the executable bit, which artifact zips would drop.
      - name: Package
        run: |
          mkdir package
          cp LICENSE package/
          if [ "$RUNNER_OS" = Windows ]; then
            cp install/bin/simulacra.exe package/
            (cd package && 7z a "../simulacra-$TARGET.zip" .)
          else
            cp install/bin/simulacra package/
            tar -czf "simulacra-$TARGET.tar.gz" -C package .
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulacra-${{ matrix.target }}
          path: simulacra-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Check out the checker and the golden hashes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, container: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, container: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container && 'true' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: simulacra-${{ matrix.target }}
          path: download

      - name: Unpack
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -odist "download/simulacra-$TARGET.zip"
          else
            tar -xzf "download/simulacra-$TARGET.tar.gz" -C dist
          fi
          ls -l dist

      - name: Show the dynamic libraries the binary needs
        if: runner.os == 'Linux'
        run: ldd dist/simulacra

      - name: Check the binary against the golden hashes
        run: |
          binary=dist/simulacra
          if [ "$RUNNER_OS" = Windows ]; then binary=dist/simulacra.exe; fi
          sh core/cli/tests/golden.sh check "$binary" \
            ${CONTAINER:+--container "$NO_PYTHON_IMAGE"}

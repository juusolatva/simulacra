sonar.organization=juusolatva
sonar.projectKey=juusolatva_abstract-art

sonar.sources=simulacra.py,bench_simulacra.py,core/engine/src,core/py/src,core/cli/src
sonar.tests=test_simulacra.py
sonar.exclusions=core/target/**
# The palette table is data generated from PALETTES in simulacra.py (a test keeps
# them equal); its rows of (r, g, b) tuples are not duplicated logic.
sonar.cpd.exclusions=core/engine/src/palettes.rs

# Line and branch coverage of the Python code from `coverage xml`, and Rust line
# coverage from cargo-llvm-cov (cargo test, the Python suite with an instrumented
# core and StandaloneCliTests with an instrumented binary); see core/coverage.sh.
sonar.python.coverage.reportPaths=coverage.xml
sonar.rust.lcov.reportPaths=lcov.info
# The benchmark is a developer tool that .coveragerc omits; don't count it as uncovered.
sonar.coverage.exclusions=bench_simulacra.py
sonar.python.version=3.10,3.11,3.12,3.13,3.14

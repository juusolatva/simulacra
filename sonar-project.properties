sonar.organization=juusolatva
sonar.projectKey=juusolatva_abstract-art

sonar.sources=simulacra.py,bench_simulacra.py,core/engine/src,core/py/src
sonar.tests=test_simulacra.py
sonar.exclusions=core/target/**

# Line and branch coverage of the Python code from `coverage xml` (see sonarqube.yml).
# The Rust core is exercised through those tests, but Rust coverage is not collected.
sonar.python.coverage.reportPaths=coverage.xml
# The benchmark is a developer tool that .coveragerc omits; don't count it as uncovered.
sonar.coverage.exclusions=bench_simulacra.py
sonar.python.version=3.10,3.11,3.12,3.13,3.14

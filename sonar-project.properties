sonar.organization=juusolatva
sonar.projectKey=juusolatva_abstract-art

sonar.sources=core/engine/src,core/cli/src
sonar.tests=core/engine/tests,core/cli/tests
sonar.exclusions=core/target/**
# The palette table is data (a unit test keeps it sorted and valid); its rows of
# (r, g, b) tuples are not duplicated logic.
sonar.cpd.exclusions=core/engine/src/palettes.rs

# Rust line coverage from cargo-llvm-cov over the workspace tests, the CLI
# integration tests running an instrumented binary; see core/coverage.sh.
sonar.rust.lcov.reportPaths=lcov.info

[package]
name = "abstract_art_core"
version = "0.1.0"
edition = "2024"
description = "Native (Rust) renderers for abstract_art.py"
license = "MIT"
publish = false

[lib]
# Must match the #[pymodule] name in src/lib.rs.
name = "abstract_art_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
rayon = "1.12"

[profile.release]
lto = "fat"
codegen-units = 1

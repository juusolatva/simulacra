# Workspace for Simulacra (see PLAN.md, "Target architecture").
# engine: the renderer (scenes, shaders, palettes), usable as a library.
# cli:    the `simulacra` command-line tool.
[workspace]
members = ["cli", "engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
rayon = "1.12"
# No default features: the `arch` feature would use platform intrinsics where they exist.
libm = { version = "0.2.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: without it, serde_json parses floats with a power-of-ten
# multiply or divide that can be off in the last bit; scenes must load exactly.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
# zlib streams for PNG (pure-Rust miniz_oxide backend) and the chunk CRCs.
flate2 = "1.1.10"
crc32fast = "1.5.3"

[profile.release]
lto = "fat"
codegen-units = 1

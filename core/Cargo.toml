[package]
name = "simulacra_core"
version = "0.1.0"
edition = "2024"
description = "Native (Rust) renderers for simulacra.py"
license = "MIT"
publish = false

[lib]
# Must match the #[pymodule] name in src/lib.rs.
name = "simulacra_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
rayon = "1.12"
libm = { version = "0.2.16", optional = true }

[features]
# Route libm calls through the pure-Rust libm crate (same results on every target).
portable = ["dep:libm"]

[profile.release]
lto = "fat"
codegen-units = 1

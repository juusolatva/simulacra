# Workspace for the native side of Simulacra (see PLAN.md, "Target architecture").
# engine: the renderer, with no Python dependency unless its `python` feature is on.
# py:     the `simulacra_core` Python extension, a thin adapter over the engine.
# A `cli` crate joins in Phase 3.
[workspace]
members = ["engine", "py"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
pyo3 = "0.30"
rayon = "1.12"
# No default features: the `arch` feature would use platform intrinsics where they exist.
libm = { version = "0.2.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: without it, serde_json parses floats with a power-of-ten
# multiply or divide that can be off in the last bit; scenes must load exactly.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"

[profile.release]
lto = "fat"
codegen-units = 1

[package]
name = "abstract_art_core"
version = "0.1.0"
edition = "2024"
description = "Native (Rust) renderers for abstract_art.py"
license = "MIT"
publish = false

[lib]
# Must match the #[pymodule] name in src/lib.rs.
name = "abstract_art_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
rayon = "1.12"
# Only for the `portable` math backend. Without the `arch` feature it uses the
# same pure-Rust routines on every target.
libm = { version = "0.2.16", default-features = false, optional = true }

[features]
# Route libm calls through the `libm` crate (see src/math.rs).
portable = ["dep:libm"]

[profile.release]
lto = "fat"
codegen-units = 1

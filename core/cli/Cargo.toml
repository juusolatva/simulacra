[package]
name = "simulacra_cli"
description = "The standalone Simulacra command-line tool (no Python needed)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "simulacra"
path = "src/main.rs"

[dependencies]
simulacra_engine = { path = "../engine" }
clap = { workspace = true }
flate2 = { workspace = true }
crc32fast = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
